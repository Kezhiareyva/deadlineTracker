version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - ./backend/.env
    volumes:
      # Menyimpan sesi login WhatsApp agar tidak perlu scan QR tiap kali container direstart
      - whatsapp_session:/app/.wwebjs_auth
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80" # Map port 5173 (di komputer Anda) ke port 80 (Nginx di dalam container)
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whatsapp_session:
